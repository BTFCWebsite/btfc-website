  <title>BTFC Reserves Fixtures & Results</title>
  <style>
    :root{--btfc-navy:#041B5F;--btfc-blue:#1149D8;--btfc-border:#DCE3F1;--btfc-text:#172554;--btfc-pale:#F3F6FC}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:var(--btfc-text);font-family:Montserrat,Arial,sans-serif}
    .feed{width:100%;overflow-x:auto;margin:0 0 28px}
    div[id^="lrep"]{width:100%!important;max-width:100%!important;overflow-x:auto}
    div[id^="lrep"] table{width:100%!important;max-width:100%!important;border-collapse:separate!important;border-spacing:0!important;border:1px solid var(--btfc-border)!important;border-radius:8px!important;background:#fff!important;color:var(--btfc-text)!important;font-family:Montserrat,Arial,sans-serif!important;font-size:13px!important}
    div[id^="lrep"] thead,div[id^="lrep"] th{background:var(--btfc-navy)!important;color:#fff!important}
    div[id^="lrep"] th{padding:12px 10px!important;border:0!important;border-bottom:3px solid var(--btfc-blue)!important;font-size:11px!important;font-weight:800!important;text-transform:uppercase!important;white-space:nowrap!important}
    div[id^="lrep"] td{padding:11px 10px!important;border:0!important;border-bottom:1px solid var(--btfc-border)!important;background:#fff!important;color:var(--btfc-text)!important;font-weight:600!important}
    div[id^="lrep"] tr:nth-child(even) td{background:var(--btfc-pale)!important}
    div[id^="lrep"] a{color:var(--btfc-blue)!important;font-weight:800!important;text-decoration:none!important}
    @media(max-width:640px){div[id^="lrep"] table{min-width:580px!important;font-size:12px!important}div[id^="lrep"] th,div[id^="lrep"] td{padding:9px 7px!important}}
  </style>
</head>
